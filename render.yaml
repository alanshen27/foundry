# FOUNDRY — Render Blueprint (IaC)
# https://dashboard.render.com/blueprint/new
#
# Hosted Postgres / Auth / Storage stay on Supabase. Redis is external
# (e.g. Upstash) — set REDIS_URL in the foundry-shared env group.
# This Blueprint deploys the Next.js app, BullMQ chat worker, and Yjs
# collab WebSocket service.
#
# After the first sync:
# 1. Fill every sync:false env var in the foundry-shared group (+ web-only).
# 2. Set Supabase Auth Site URL + redirect allowlist to APP_ORIGIN
#    (and APP_ORIGIN/auth/confirm, APP_ORIGIN/auth/callback).
# 3. Paste supabase/templates/*.html into Supabase Auth email templates.
# 4. Set NEXT_PUBLIC_COLLAB_URL (web) to wss://<foundry-collab-host>
#
# Build note: --prod=false keeps prisma/typescript (devDependencies) available
# even when Render sets NODE_ENV=production during build.

envVarGroups:
  - name: foundry-shared
    envVars:
      - key: AUTH_MODE
        value: supabase
      - key: STORAGE_BUCKET
        value: artifacts
      - key: AI_MODEL
        value: gpt-5.6
      - key: AUTH_SECRET
        generateValue: true
      # Supabase Postgres (pooled + direct for DDL)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # External Redis (Upstash / etc). Use rediss:// for TLS.
      - key: REDIS_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ZOO_API_TOKEN
        sync: false
      - key: V0_API_KEY
        sync: false

services:
  - type: web
    name: foundry-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --frozen-lockfile --prod=false && pnpm --filter @foundry/db generate && pnpm --filter @foundry/web build
    startCommand: pnpm --filter @foundry/web start
    healthCheckPath: /
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    envVars:
      - fromGroup: foundry-shared
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_REALTIME_MODE
        value: supabase
      - key: APP_ORIGIN
        fromService:
          name: foundry-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_COLLAB_URL
        sync: false
      - key: FOUNDRY_DEFAULT_WORKSPACE_SLUG
        sync: false

  - type: worker
    name: foundry-chat-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --frozen-lockfile --prod=false && pnpm --filter @foundry/db generate
    startCommand: pnpm --filter @foundry/web worker:chat:prod
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    envVars:
      - fromGroup: foundry-shared
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_REALTIME_MODE
        value: off
      - key: APP_ORIGIN
        fromService:
          name: foundry-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: foundry-collab
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --frozen-lockfile --prod=false && pnpm --filter @foundry/db generate
    startCommand: pnpm --filter @foundry/collab-server start:prod
    buildFilter:
      paths:
        - apps/realtime/**
        - packages/collaboration/**
        - packages/config/**
        - packages/db/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
    envVars:
      - fromGroup: foundry-shared
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_REALTIME_MODE
        value: off
