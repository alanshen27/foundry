# FOUNDRY — Render Blueprint (IaC)
# https://dashboard.render.com/blueprint/new
#
# Hosted Postgres / Auth / Storage stay on Supabase. Redis is external
# (e.g. Upstash). All env lives in foundry-shared — services only link the group.
#
# After the first sync:
# 1. Fill every sync:false secret in foundry-shared (see comments below).
# 2. Set Supabase Auth Site URL + redirect allowlist to APP_ORIGIN
#    (and APP_ORIGIN/auth/confirm, APP_ORIGIN/auth/callback).
# 3. Paste supabase/templates/*.html into Supabase Auth email templates.
#
# Build notes:
# - Do NOT run `corepack enable` — Render's Node image ships pnpm on a
#   read-only /usr/bin; enable fails with EROFS.
# - --prod=false keeps prisma/typescript (devDependencies) for generate/build.
# - engines.node is pinned to 22.x (package.json) so Render doesn't pick Node 26.
# - Chromium must be downloaded during the build (see PLAYWRIGHT_BROWSERS_PATH).
#   playwright-core ships no browser binaries, and modern Playwright has no
#   postinstall hook, so `pnpm install` alone never produces one.
#
# Migrations:
# - Every service runs `pnpm db:migrate:deploy` as its preDeployCommand.
#   Prisma takes an advisory lock, so the three concurrent runs are safe, and
#   a failed migration cancels that deploy while the previous one keeps
#   serving. An existing `db push` database must be baselined once first
#   (docs/runbooks/deploy-render.md) or every deploy stops at this step.

envVarGroups:
  - name: foundry-shared
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AUTH_MODE
        value: supabase
      - key: NEXT_PUBLIC_REALTIME_MODE
        value: supabase
      - key: STORAGE_BUCKET
        value: artifacts
      # Where `playwright install` writes Chromium and where playwright-core
      # looks for it at runtime. MUST live under /opt/render/project: Render
      # only carries the project directory from the build into the runtime
      # container, so the default $HOME/.cache/ms-playwright (= /opt/render/
      # .cache) is downloaded during the build and then gone at start.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright
      - key: AI_MODEL
        value: gpt-5.6
      - key: AI_LIGHT_MODEL
        value: gpt-4.1-nano
      - key: CAD_MODEL
        value: gpt-6-astra
      - key: AUTH_SECRET
        generateValue: true
      # Public web URL (https://foundry-web-….onrender.com or custom domain).
      # Required: config refuses to boot on Render without it, because the
      # worker's screenshot tools and auth email redirects are built from it.
      - key: APP_ORIGIN
        sync: false
      # Supabase Postgres (pooled + direct for DDL)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # External Redis (Upstash / etc). Use rediss:// for TLS.
      - key: REDIS_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Browser WebSocket for Engineer > Code (wss://<foundry-collab-host>).
      - key: NEXT_PUBLIC_COLLAB_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Jev triage for chat messages without @AI. Unset = only @AI triggers.
      - key: OPENROUTER_API_KEY
        sync: false
      # Copilot cost controls. AI_RUNS_PER_HOUR caps turns per user (default
      # 30); AI_WORKSPACE_DAILY_TOKEN_BUDGET caps tokens per workspace per
      # rolling 24h (unset = recorded but uncapped). Set a budget before any
      # public demo link goes out.
      # Error tracking for web, worker and collab. Unset = logs only.
      - key: SENTRY_DSN
        sync: false
      - key: AI_RUNS_PER_HOUR
        sync: false
      - key: AI_WORKSPACE_DAILY_TOKEN_BUDGET
        sync: false
      - key: AI_MAX_OUTPUT_TOKENS
        sync: false
      - key: ZOO_API_TOKEN
        sync: false
      - key: V0_API_KEY
        sync: false
      # Launch media video model (stills reuse OPENAI_API_KEY). Leave unset to
      # keep video generation refusing rather than faking footage.
      - key: MEDIA_VIDEO_MODEL
        sync: false
      - key: FOUNDRY_DEFAULT_WORKSPACE_SLUG
        sync: false

services:
  - type: web
    name: foundry-web
    runtime: node
    # Pro = 4GB. Next + Chromium (thumbnails / viewport captures) OOMs on
    # Starter (512MB) and can still bounce Standard (2GB).
    plan: pro
    region: oregon
    # --only-shell: server/ai/render.ts always launches headless, which resolves
    # to chromium-headless-shell. Skipping headful Chromium halves the download.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @foundry/web exec playwright install --only-shell chromium && pnpm --filter @foundry/db generate && pnpm --filter @foundry/web build
    preDeployCommand: pnpm db:migrate:deploy
    startCommand: pnpm --filter @foundry/web start
    # Liveness only. /api/ready additionally checks Postgres and Redis for
    # smoke tests and uptime monitors.
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    envVars:
      - fromGroup: foundry-shared

  - type: worker
    name: foundry-chat-worker
    runtime: node
    # Pro = 4GB — same Chromium memory floor as foundry-web (tool loop drives
    # extract_product_images + viewport captures).
    plan: pro
    region: oregon
    # The worker runs the copilot tool loop (server/ai/tools.ts), so it drives
    # Chromium too — extract_product_images and the viewport captures both fail
    # here without a browser, surfacing as "Image extraction failed" in chat.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @foundry/web exec playwright install --only-shell chromium && pnpm --filter @foundry/db generate
    preDeployCommand: pnpm db:migrate:deploy
    startCommand: pnpm --filter @foundry/web worker:chat:prod
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    envVars:
      - fromGroup: foundry-shared

  - type: web
    name: foundry-collab
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @foundry/db generate
    preDeployCommand: pnpm db:migrate:deploy
    startCommand: pnpm --filter @foundry/collab-server start:prod
    # Hocuspocus answers any plain HTTP GET with 200 "OK".
    healthCheckPath: /
    # Every workspace package the collab server imports, so web, worker and
    # collab always redeploy together when shared code changes.
    buildFilter:
      paths:
        - apps/realtime/**
        - packages/collaboration/**
        - packages/config/**
        - packages/db/**
        - packages/domain/**
        - packages/observability/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    envVars:
      - fromGroup: foundry-shared
