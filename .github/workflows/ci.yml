name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundry
          POSTGRES_PASSWORD: foundry
          POSTGRES_DB: foundry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://foundry:foundry@localhost:5432/foundry
      DIRECT_URL: postgresql://foundry:foundry@localhost:5432/foundry
      AUTH_MODE: local
      AUTH_SECRET: ci-secret
      STORAGE_MODE: local
      STORAGE_BUCKET: artifacts
      # Placeholders: AUTH_MODE/STORAGE_MODE=local never contact Supabase,
      # but packages/config requires these vars to be set.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      NEXT_PUBLIC_REALTIME_MODE: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Build the database from the migration history, not from schema.prisma:
      # this is what proves the migrations production will run actually work.
      - run: pnpm db:migrate:deploy
      # Fails if schema.prisma changed without a migration to match.
      - name: Check migrations match schema.prisma
        run: pnpm db:migrate:check
      - run: pnpm db:seed
      - run: pnpm test
      # The dev-server e2e below cannot catch a broken production build
      # (RSC boundaries, server-only imports, the kcl wasm prebuild).
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm --filter @foundry/web exec playwright install --with-deps chromium
      - run: pnpm e2e
