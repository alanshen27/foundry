# Local Postgres for development without a hosted Supabase project.
# Usage: docker compose -f infra/local/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry
    ports:
      - "5432:5432"
    volumes:
      - foundry-pg:/var/lib/postgresql/data

volumes:
  foundry-pg:
