<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your FOUNDRY sign-in link</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f4f2ec;
      color: #0c0c0c;
      font-family: &quot;IBM Plex Mono&quot;, ui-monospace, SFMono-Regular, Menlo, monospace;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f4f2ec"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 480px; border: 1px solid #d6d3cb; background: #faf9f5"
          >
            <tr>
              <td
                style="
                  background: #ff5a00;
                  color: #faf9f5;
                  padding: 28px 24px;
                  background-image: radial-gradient(
                    circle,
                    rgba(250, 249, 245, 0.35) 0.7px,
                    transparent 0.8px
                  );
                  background-size: 5px 5px;
                "
              >
                <div
                  style="
                    font-size: 11px;
                    letter-spacing: 0.18em;
                    text-transform: uppercase;
                    opacity: 0.9;
                  "
                >
                  Foundry / Auth
                </div>
                <div
                  style="
                    margin-top: 18px;
                    font-size: 22px;
                    letter-spacing: -0.03em;
                    font-weight: 500;
                  "
                >
                  Sign-in link
                </div>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 28px 24px;
                  font-family: &quot;IBM Plex Sans&quot;, Helvetica, Arial, sans-serif;
                "
              >
                <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #0c0c0c">
                  Use this one-time link for
                  <strong style="font-family: &quot;IBM Plex Mono&quot;, monospace"
                    >{{ .Email }}</strong
                  >.
                </p>
                <p style="margin: 24px 0 0">
                  <a
                    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/"
                    style="
                      display: inline-block;
                      background: #0c0c0c;
                      color: #faf9f5;
                      text-decoration: none;
                      padding: 12px 18px;
                      font-family: &quot;IBM Plex Mono&quot;, ui-monospace, monospace;
                      font-size: 12px;
                      letter-spacing: 0.12em;
                      text-transform: uppercase;
                    "
                    >Enter workspace</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
