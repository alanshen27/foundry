<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="FOUNDRY final presentation: twelve minutes of slides and an eight-minute live demo."
    />
    <title>FOUNDRY — Final Presentation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="deck" aria-label="FOUNDRY final presentation">
      <canvas id="webgl-field" aria-hidden="true"></canvas>
      <div id="slides"></div>
    </main>

    <button class="nav prev" type="button" aria-label="Previous slide">←</button>
    <button class="nav next" type="button" aria-label="Next slide">→</button>
    <button class="help" type="button" aria-label="Show presentation controls">? CONTROLS</button>
    <div class="progress" aria-hidden="true"></div>

    <div class="overlay notes-overlay" role="dialog" aria-modal="true">
      <div class="overlay-panel">
        <button class="overlay-close" type="button">CLOSE · N</button>
        <div class="notes-content"></div>
      </div>
    </div>

    <div class="overlay help-overlay" role="dialog" aria-modal="true">
      <div class="overlay-panel">
        <button class="overlay-close" type="button">CLOSE · ESC</button>
        <h2>Presentation controls</h2>
        <ul>
          <li><strong>Next:</strong> Right Arrow, Page Down, Space</li>
          <li><strong>Previous:</strong> Left Arrow, Page Up</li>
          <li><strong>Opening / closing:</strong> Home / End</li>
          <li><strong>Speaker notes:</strong> N</li>
          <li><strong>Fullscreen:</strong> F</li>
        </ul>
        <p>
          The visible 1/12 counter excludes the opening and closing screens. Slides 1–3: Will. 4–6:
          Alan. 7–9: Jason. 10–12: Zhiheng.
        </p>
      </div>
    </div>

    <script src="deck.js"></script>
  </body>
</html>
